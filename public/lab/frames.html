<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Frame test</title>
<style>
  /* Bare test page: no fonts, no canvas, no site code. Three animations, each
     driven differently, to see what stops when the mouse moves.
     ?snap adds tall sections with the same scroll snapping as the main site. */
  :root { color-scheme: dark; }
  html { background: #000; }
  body { margin: 0; background: #000; color: #3dff7f; font: 15px/1.6 ui-monospace, Menlo, monospace; }
  .wrap { position: fixed; inset: 0; display: grid; place-content: center; gap: 36px; text-align: center; padding: 16px; }
  .row { display: flex; gap: 40px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .cell { display: grid; gap: 10px; justify-items: center; width: 150px; }
  .blink { width: 24px; height: 40px; background: #3dff7f; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .spin { width: 40px; height: 40px; border: 3px solid #3dff7f; animation: spin 1.5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { width: 150px; height: 40px; position: relative; border: 1px solid #1a5c34; }
  .bar i { position: absolute; top: 0; bottom: 0; width: 8px; background: #3dff7f; }
  .label { color: #7f9688; font-size: 12px; }
  #fps { font-size: 22px; }
  .tall { height: 100vh; scroll-snap-align: center; scroll-snap-stop: always; border-top: 1px dashed #1a5c34; }
  html.snap { scroll-snap-type: y mandatory; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="cell"><div class="blink"></div><div class="label">CSS blink</div></div>
    <div class="cell"><div class="spin"></div><div class="label">CSS rotate</div></div>
    <div class="cell"><div class="bar"><i id="dot"></i></div><div class="label">JavaScript</div></div>
  </div>
  <div><span id="fps">–</span> <span class="label">fps · worst frame <span id="worst">–</span> ms</span></div>
  <div class="label">Move the mouse around. Which of the three stop?<br><span id="mode"></span></div>
</div>
<div id="space"></div>
<script>
  if (location.search.includes('snap')) {
    document.documentElement.classList.add('snap');
    document.getElementById('space').innerHTML = '<div class="tall"></div>'.repeat(6);
    document.getElementById('mode').textContent = 'mode: with scroll snapping (scroll too)';
  } else document.getElementById('mode').textContent = 'mode: plain';
  const dot = document.getElementById('dot'), fpsEl = document.getElementById('fps'), worstEl = document.getElementById('worst');
  let last = performance.now(), gaps = [];
  (function tick(t) {
    gaps.push(t - last); last = t; if (gaps.length > 120) gaps.shift();
    dot.style.left = (Math.sin(t / 400) * 0.5 + 0.5) * 142 + 'px';
    requestAnimationFrame(tick);
  })(last);
  setInterval(() => {
    const avg = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    fpsEl.textContent = Math.round(1000 / avg);
    worstEl.textContent = Math.round(Math.max(...gaps));
  }, 300);
</script>
</body>
</html>
